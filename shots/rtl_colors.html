<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0E1116; color:#E9EEF7; }
  .card {
    width: 665px; height: 70px; box-sizing: border-box;
    background:#141922; border:1px solid #323B4A; border-radius:12px;
    padding: 12px; margin: 14px 25px;
    font-family:"Segoe UI", sans-serif; font-size:18px;
    display:flex; align-items:center;
  }
  .ar { direction: rtl; unicode-bidi: plaintext; text-align: right; width:100%; }
  .w1 { background:#c0392b; } .w2 { background:#27963c; }
  .w3 { background:#2c6fbb; } .w4 { background:#c9a227; }
</style>
</head>
<body>
  <div class="card"><div class="ar"><span class="w1">النص</span> <span class="w2">Hello</span> <span class="w3">123</span> <span class="w4">مرحبا</span></div></div>
  <div class="card"><div class="ar"><span class="w1">ضع</span> <span class="w2">المؤشر</span> <span class="w3">على</span> <span class="w4">أي</span> <span class="w1">نص</span> <span class="w2">لقراءته</span> <span class="w3">بلغتك</span></div></div>
</body>
</html>
