<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0E1116; color:#E9EEF7; }
  .card {
    width: 665px; height: 70px; box-sizing: border-box;
    background:#141922; border:1px solid #323B4A; border-radius:12px;
    padding: 12px; margin: 14px 25px;
    font-family:"Segoe UI", "Segoe UI Variable", sans-serif;
    font-size:15.5px;
    display:flex; align-items:center;
  }
  .ar { direction: rtl; unicode-bidi: plaintext; text-align: right; width:100%; }
</style>
</head>
<body>
  <div class="card"><div class="ar">ضع المؤشر على أي نص لقراءته بلغتك</div></div>
  <div class="card"><div class="ar">النص Hello 123 مرحبا</div></div>
  <div class="card"><div class="ar">مرحبا Hello world 123</div></div>
</body>
</html>
