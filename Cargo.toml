[package]
name = "hovertranslate"
version = "0.1.0"
edition = "2024"

# The official distributable deliberately uses the dev codegen settings: this
# is the build that has been verified on Windows. Use:
#   cargo build --profile official
[profile.official]
inherits = "dev"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "__screenshot"] }
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Graphics_Direct3D11", "Win32_Storage_Xps", "Win32_UI_HiDpi"] }
